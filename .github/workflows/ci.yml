name: ci

# Everything here runs on a stock GitHub runner. The point is that a clone with
# no local toolchain still proves the three layers: the Dart protocol core, the
# Host plugin, and the Flutter client.
#
# The HarmonyOS client is ArkTS, not Flutter: `tools/ohos-probe/` builds it with
# the public OpenHarmony 7.0 SDK plus hvigor from repo.harmonyos.com, which needs
# neither a Huawei account nor a macOS host (docs/harmony-packaging.md records the
# six errors that layout has to satisfy). That build still wants a ~3 GB SDK
# download, so it stays a manual job rather than running on every push.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Dart protocol core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Analyze
        working-directory: packages/dsh_link
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/dsh_link
        run: dart test

  host:
    name: Host plugin and relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install relay dependencies
        working-directory: relay
        run: npm install --no-audit --no-fund
      - name: Syntax check every plugin module
        working-directory: host
        run: for file in *.js; do node --check "$file"; done
      - name: Test
        run: node --test host

  arkts:
    name: TypeScript protocol core (HarmonyOS source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # relay_contract 会起真的 relay/run.mjs，所以中继的 ws 依赖要先装。
      - name: Install relay dependencies
        working-directory: relay
        run: npm install --no-audit --no-fund
      - name: Install build dependency
        working-directory: packages/dsh_arkts
        run: npm install --no-audit --no-fund
      - name: Golden vectors, protocol, framing, client, relay checks
        working-directory: packages/dsh_arkts
        run: npm test

  client:
    name: Flutter client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

  harmony:
    name: HarmonyOS HAP (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for a usable SDK
        shell: pwsh
        run: |
          # build.ps1 要的是 <SDK 根>\26.0.0\{ets,js,native,toolchains,previewer}。
          # 公开 SDK 有 3 GB，装不进 runner 的缓存，所以这里先看有没有人摆好。
          $sdk = $env:OHOS_BASE_SDK_HOME
          if (-not $sdk) { $sdk = $env:DEVECO_SDK_HOME }
          if ($sdk -and (Test-Path "$sdk\26.0.0\ets\oh-uni-package.json")) {
            Write-Host "SDK 就绪：$sdk"
            exit 0
          }
          Write-Host '没有 OpenHarmony SDK，这个手动 job 跳过真实构建。'
          Write-Host '下载（公开，不需要华为账号）：'
          Write-Host '  https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public.tar.gz'
          Write-Host '解出 windows/ 下五个 zip，摆成 <SDK 根>\26.0.0\{ets,js,native,toolchains,previewer}'
          Write-Host '再设置 OHOS_BASE_SDK_HOME=<SDK 根>，然后重跑这个 job。'
          Write-Host '本地等价命令见 docs/harmony-packaging.md。'
          exit 1
      - name: Install hvigor
        working-directory: tools/ohos-probe
        shell: pwsh
        run: npm install --registry=https://repo.harmonyos.com/npm @ohos/hvigor@6.26.20 @ohos/hvigor-ohos-plugin@6.26.20 --no-audit --no-fund
      - name: Build and sign the HAP
        working-directory: tools/ohos-probe
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-harness-hap
          path: tools/ohos-probe/entry/build/**/entry-default-signed.hap
          if-no-files-found: error
